<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Musical Memories app icon: a warm paper vinyl record on the app's
       own Liner Notes burgundy, using the existing theme's accent, bg,
       and accent hover tokens from App.css, not a new palette. Kept
       simple and legible at small sizes, with real padding around the
       record so it survives an OS maskable icon crop. -->
  <rect width="512" height="512" fill="#8a2f3f" />
  <circle cx="256" cy="256" r="164" fill="#f1f0eb" />
  <circle cx="256" cy="256" r="164" fill="none" stroke="#6f2532" stroke-opacity="0.18" stroke-width="3" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#6f2532" stroke-opacity="0.16" stroke-width="2" />
  <circle cx="256" cy="256" r="116" fill="none" stroke="#6f2532" stroke-opacity="0.14" stroke-width="2" />
  <circle cx="256" cy="256" r="92" fill="none" stroke="#6f2532" stroke-opacity="0.12" stroke-width="2" />
  <circle cx="256" cy="256" r="56" fill="#d9a24b" />
  <circle cx="256" cy="256" r="10" fill="#8a2f3f" />
</svg>
