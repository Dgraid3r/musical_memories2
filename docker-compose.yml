services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: musical_memories
      POSTGRES_PASSWORD: musical_memories
      POSTGRES_DB: musical_memories
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musical_memories"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
