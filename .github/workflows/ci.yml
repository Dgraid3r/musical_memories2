name: CI

"on":
  push:
    branches: [master, staging]
  pull_request:
    branches: [master, staging]
  workflow_dispatch: {}

jobs:
  backend:
    name: Backend (migrations + tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: musical_memories
          POSTGRES_PASSWORD: musical_memories
          POSTGRES_DB: musical_memories
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U musical_memories"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # DATABASE_URL points at the main musical_memories database - used by
    # the migration step below. The test suite doesn't actually read this:
    # backend/tests/conftest.py overwrites DATABASE_URL in-process to point
    # at musical_memories_test (created in its own step below) before any
    # app code is imported, the same as it does for local test runs.
    #
    # PG_DUMP_COMMAND/PSQL_COMMAND: backend/tests/test_backup_restore_roundtrip.py
    # calls the real pg_dump/psql binaries. Locally (no native install on
    # the dev machine) it falls back to routing through docker compose exec
    # into the postgres container, but there's no docker-compose service
    # here - just the plain Postgres *service container* below, reachable
    # directly on localhost:5432 - so these tell it to invoke the plain
    # binaries on PATH instead (installed, if not already present, in the
    # step below).
    env:
      DATABASE_URL: postgresql+psycopg://musical_memories:musical_memories@localhost:5432/musical_memories
      PG_DUMP_COMMAND: pg_dump
      PSQL_COMMAND: psql

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Ensure postgresql-client (pg_dump/psql) is available
        # Verified at run time rather than assumed: ubuntu-latest runners
        # typically already have this, but check first and only install
        # if actually missing, and print the resolved versions either way
        # so it's visible in the log what ran.
        run: |
          if ! command -v pg_dump >/dev/null 2>&1 || ! command -v psql >/dev/null 2>&1; then
            echo "postgresql-client not found - installing..."
            sudo apt-get update && sudo apt-get install -y postgresql-client
          else
            echo "postgresql-client already present."
          fi
          pg_dump --version
          psql --version

      - name: Create test database
        # Mirrors docker/init-test-db.sh's local dev-container setup - a
        # GitHub Actions Postgres service only creates the one POSTGRES_DB
        # database at start, so the separate test database conftest.py
        # expects (musical_memories_test) needs its own creation step here.
        run: PGPASSWORD=musical_memories psql -h localhost -U musical_memories -d musical_memories -c "CREATE DATABASE musical_memories_test;"

      - name: Run database migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Run backend test suite
        working-directory: backend
        run: pytest -q

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build
