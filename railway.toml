# Points Railway explicitly at the repo-root Dockerfile - without this,
# Railway's auto-detection could get confused by the monorepo layout
# (a frontend/ and backend/ side by side) or by the *other* Dockerfile
# in this repo (backend/Dockerfile.backup, for the daily-backup sidecar -
# a separate optional Railway service, see DEPLOYMENT.md, not this one).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# /api/health actually checks the database (see backend/app/main.py) -
# Railway uses this to know a deploy is genuinely healthy before routing
# traffic to it, not just that the process started.
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
